name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  off-hardware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: bash tools/check.sh
